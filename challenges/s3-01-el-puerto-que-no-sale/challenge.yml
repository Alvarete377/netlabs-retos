id: s3-01-el-puerto-que-no-sale
title: El puerto que no sale
level: 103
type: troubleshoot
difficulty: easy
objectives:
  - "Desde pc1, http://10.0.0.10:8080/ carga la intranet que sirve el contenedor `web` (nginx)"
  - "La página sigue saliendo de /srv/intranet del servidor, montada en el contenedor"
hints:
  - "En srv: `podman ps` (o `docker ps`, es el mismo Podman). Mira la columna PORTS: ¿hay algún puerto del servidor apuntando al contenedor?"
  - "Un contenedor tiene su propia red: nginx escucha en el 80 *del contenedor*. Para entrar desde fuera hay que publicarlo: `-p 8080:80` (puerto del servidor : puerto del contenedor)."
  - "Los puertos se fijan al crear el contenedor; no se añaden a uno que ya existe. Mira con qué se creó (`podman inspect web`, apartado Mounts) para no perder la carpeta montada."
  - "`podman rm -f web` y `podman run -d --name web -p 8080:80 -v /srv/intranet:/usr/share/nginx/html:ro nginx:1.27-alpine`. Compruébalo con `podman port web` y desde pc1."
