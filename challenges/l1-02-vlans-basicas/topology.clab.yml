name: netlabs
topology:
  kinds:
    mikrotik_ros:
      image: netlabs/chr:7.16.2
    linux:
      image: netlabs/client:0.1
  nodes:
    sw1: {kind: mikrotik_ros}
    pc1:
      kind: linux
      exec: ["ip addr add 10.0.0.1/24 dev eth1"]
    pc2:
      kind: linux
      exec: ["ip addr add 10.0.0.2/24 dev eth1"]
    pc3:
      kind: linux
      exec: ["ip addr add 10.0.0.3/24 dev eth1"]
  links:
    - endpoints: ["sw1:eth1", "pc1:eth1"]
    - endpoints: ["sw1:eth2", "pc2:eth1"]
    - endpoints: ["sw1:eth3", "pc3:eth1"]
