- ping: {from: pc1, to: 10.0.0.2, expect: ok}
- ping: {from: pc1, to: 10.0.0.3, expect: fail}
- ping: {from: pc2, to: 10.0.0.3, expect: fail}
- routeros:
    node: sw1
    cmd: "/interface bridge print count-only where vlan-filtering=yes"
    expect: "1"
    desc: "sw1 tiene un bridge con vlan-filtering activo"
- routeros:
    node: sw1
    cmd: "/interface bridge port print count-only where interface=ether4 pvid=20 disabled=no"
    expect: "1"
    desc: "pc3 (ether4) está en la VLAN 20"
- routeros:
    node: sw1
    cmd: "/interface print count-only where name=ether4 disabled=no"
    expect: "1"
    desc: "ether4 (pc3) está activa"
- routeros:
    node: sw1
    cmd: "/interface bridge port print count-only where pvid=10 disabled=no and (interface=ether2 or interface=ether3)"
    expect: "2"
    desc: "pc1 y pc2 (ether2, ether3) están en la VLAN 10"
