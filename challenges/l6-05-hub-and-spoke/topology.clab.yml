name: netlabs
topology:
  kinds:
    mikrotik_ros:
      image: netlabs/chr:7.16.2
    linux:
      image: netlabs/client:0.1
  nodes:
    hub: {kind: mikrotik_ros}
    isp: {kind: mikrotik_ros}
    s1: {kind: mikrotik_ros}
    s2: {kind: mikrotik_ros}
    pc0:
      kind: linux
      exec: ["ip addr add 192.168.0.10/24 dev eth1", "ip route replace default via 192.168.0.1 dev eth1"]
    pc1:
      kind: linux
      exec: ["ip addr add 192.168.1.10/24 dev eth1", "ip route replace default via 192.168.1.1 dev eth1"]
    pc2:
      kind: linux
      exec: ["ip addr add 192.168.2.10/24 dev eth1", "ip route replace default via 192.168.2.1 dev eth1"]
  links:
    - endpoints: ["hub:eth1", "pc0:eth1"]
    - endpoints: ["hub:eth2", "isp:eth1"]
    - endpoints: ["isp:eth2", "s1:eth1"]
    - endpoints: ["isp:eth3", "s2:eth1"]
    - endpoints: ["s1:eth2", "pc1:eth1"]
    - endpoints: ["s2:eth2", "pc2:eth1"]
