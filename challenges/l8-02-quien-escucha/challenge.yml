id: l8-02-quien-escucha
title: ¿Quién escucha?
level: 8
type: capture
difficulty: easy
objectives:
  - "Investiga el servidor 192.168.20.10 desde pc1 y responde con `lab answer`: la versión de su correo y el puerto de su panel web"
  - "Deja que la LAN de administración abra el panel (sólo el panel: la base de datos sigue sin verse desde la LAN)"
  - El SSH del servidor sigue accesible y el firewall sigue terminando en drop
hints:
  - "Recorre los puertos del servidor desde pc1: `nmap -T4 -p 1-10000 192.168.20.10`. Fíjate en la diferencia entre `open`, `closed` y `filtered`."
  - "Para la versión del correo, conéctate al puerto 25 y lee lo que dice al saludar: `nc -v -w 3 192.168.20.10 25` (o `curl -v telnet://192.168.20.10:25`, o `/system telnet 192.168.20.10 port=25` desde r1)."
  - "Verás dos puertos `filtered`. ¿Cuál es el panel web? Pruébalos desde r1, que está antes del filtro: `/tool fetch url=\"http://192.168.20.10:<puerto>/\" output=user`. Luego mira qué regla de r1 los tira (`/ip firewall filter print stats`) y añade encima un `accept` sólo para el panel desde la LAN."
  - "Respuestas: Postfix 3.9.1 y puerto 8181. Arreglo: `/ip firewall filter add chain=forward in-interface=ether2 protocol=tcp dst-address=192.168.20.10 dst-port=8181 action=accept place-before=[find comment~\"servicios internos\"]`."
