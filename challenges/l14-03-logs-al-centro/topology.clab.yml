name: netlabs
topology:
  kinds:
    mikrotik_ros:
      image: netlabs/chr:7.16.2
  nodes:
    r1: {kind: mikrotik_ros}
    mon:
      kind: linux
      image: netlabs/debian:0.2
      exec: ["ip addr add 10.0.0.10/24 dev eth1", "ip route replace default via 10.0.0.1 dev eth1"]
    srv:
      kind: linux
      image: netlabs/debian:0.2
      exec: ["ip addr add 10.0.1.10/24 dev eth1", "ip route replace default via 10.0.1.1 dev eth1"]
  links:
    - endpoints: ["r1:eth1", "mon:eth1"]
    - endpoints: ["r1:eth2", "srv:eth1"]
