id: l2-01-primer-router
title: Tu primer router
level: 2
type: build
difficulty: easy
objectives:
  - pc1 (192.168.1.10) y pc2 (192.168.2.10) se hacen ping a través de r1
  - r1 es la puerta de enlace de cada LAN (192.168.1.1 y 192.168.2.1)
  - "Sin NAT: r1 enruta, no disfraza direcciones"
hints:
  - Cada LAN necesita su puerta de enlace en el router.
  - "Mira qué gateway usa cada PC: ip route en lab console pc1."
  - "/ip address add address=... interface=..."
