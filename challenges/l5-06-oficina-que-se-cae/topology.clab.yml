name: netlabs
topology:
  kinds:
    mikrotik_ros:
      image: netlabs/chr:7.16.2
    linux:
      image: netlabs/client:0.1
  nodes:
    sw: {kind: mikrotik_ros}
    r1: {kind: mikrotik_ros}
    r2: {kind: mikrotik_ros}
    pc1: {kind: linux}
    inet:
      kind: linux
      exec: ["ip addr add 198.51.100.1/30 dev eth1", "ip addr add 198.51.100.5/30 dev eth2", "ip addr add 203.0.113.10/32 dev lo"]
  links:
    - endpoints: ["sw:eth1", "pc1:eth1"]
    - endpoints: ["sw:eth2", "r1:eth1"]
    - endpoints: ["sw:eth3", "r1:eth2"]
    - endpoints: ["sw:eth4", "r2:eth1"]
    - endpoints: ["r1:eth3", "inet:eth1"]
    - endpoints: ["r2:eth2", "inet:eth2"]
