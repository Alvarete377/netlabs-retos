- routeros: {node: r1, cmd: '/ip route print count-only where dst-address=198.51.100.0/24 and active and gateway=100.64.2.1', expect: "1", desc: "r1 sale hacia la red de isp1 por isp2"}
- routeros: {node: r1, cmd: '/ip route print count-only where dst-address=192.0.2.0/24 and active and gateway=100.64.2.1', expect: "1", desc: "r1 sale hacia la red de isp2 por isp2"}
- routeros: {node: isp1, cmd: '/ip route print count-only where dst-address=203.0.113.0/24 and active and gateway=100.64.12.2', expect: "1", desc: "isp1 llega a la empresa a través de isp2"}
- routeros: {node: isp1, cmd: '/routing route print count-only where dst-address=203.0.113.0/24 and bgp.as-path~"^65000"', expect: "re:^[1-9]", desc: "isp1 sigue recibiendo la ruta directa de r1 (reserva)"}
- routeros: {node: r1, cmd: '/routing route print count-only where dst-address=198.51.100.0/24 and bgp and gateway=100.64.1.1 and !filtered', expect: "re:^[1-9]", desc: "r1 conserva la salida de reserva por isp1"}
- routeros: {node: r1, cmd: '/routing bgp session print count-only where established', expect: "2", desc: "r1 mantiene las dos sesiones"}
- routeros: {node: isp2, cmd: '/routing route print count-only where bgp.as-path~"^65000,65101"', expect: "0", desc: "isp2 no recibe por r1 las rutas de isp1 (r1 no es tránsito)"}
- routeros: {node: isp1, cmd: '/routing route print count-only where bgp.as-path~"^65000,65102"', expect: "0", desc: "isp1 no recibe por r1 las rutas de isp2"}
- ping: {from: pc1, to: 198.51.100.10, expect: ok, desc: "pc1 llega al servidor de isp1"}
