name: netlabs
topology:
  kinds:
    mikrotik_ros:
      image: netlabs/chr:7.16.2
    linux:
      image: netlabs/client:0.1
  nodes:
    r1: {kind: mikrotik_ros}
    isp1: {kind: mikrotik_ros}
    isp2: {kind: mikrotik_ros}
    pc1:
      kind: linux
      exec: ["ip addr add 203.0.113.10/24 dev eth1", "ip route replace default via 203.0.113.1 dev eth1"]
    srv:
      kind: linux
      exec: ["ip addr add 198.51.100.10/24 dev eth1", "ip route replace default via 198.51.100.1 dev eth1"]
  links:
    - endpoints: ["r1:eth1", "isp1:eth1"]
    - endpoints: ["r1:eth2", "isp2:eth1"]
    - endpoints: ["isp1:eth2", "isp2:eth2"]
    - endpoints: ["r1:eth3", "pc1:eth1"]
    - endpoints: ["isp1:eth3", "srv:eth1"]
