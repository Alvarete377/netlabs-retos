id: l5-04-router-de-reserva
title: El router de reserva
level: 5
type: build
difficulty: medium
objectives:
  - "Los PCs usan como puerta de enlace 192.168.1.1, que no pertenece a ningún router en concreto: la comparten r1 y r2 con VRRP"
  - r1 es el router activo y r2 queda en reserva, listo para tomar el relevo si r1 cae
  - pc1 sale a Internet por la puerta de enlace compartida
hints:
  - "pc1 usa 192.168.1.1 como puerta de enlace, pero ni r1 (192.168.1.2) ni r2 (192.168.1.3) la tienen. Si se la pones a r1 a mano, funcionará... hasta que r1 se apague."
  - "VRRP crea una interfaz virtual en cada router sobre la LAN; los dos se ponen de acuerdo (por prioridad) en quién es el maestro, y el maestro responde por la IP y la MAC virtuales. En RouterOS: `/interface vrrp`."
  - "En los dos routers: una interfaz VRRP sobre ether2 con el MISMO `vrid`, y prioridades distintas (más alta = maestro). Después, la IP virtual en esa interfaz VRRP de los dos routers (con /32)."
  - "r1: `/interface vrrp add name=vrrp1 interface=ether2 vrid=10 priority=200` y `/ip address add address=192.168.1.1/32 interface=vrrp1`. r2: igual con `priority=100`. Comprueba con `/interface vrrp print` (M = maestro, B = respaldo)."
