- ping: {from: pc1, to: 192.168.2.10, expect: ok, desc: "pc1 (red MikroTik) llega a pc2 (red VyOS)"}
- ping: {from: pc2, to: 192.168.1.10, expect: ok, desc: "pc2 (red VyOS) llega a pc1 (red MikroTik)"}
- vyos: {node: vy1, cmd: "show interfaces", expect: 're:eth1\s+172\.16\.12\.2/30', desc: "vy1 tiene su IP en el enlace con la central"}
- vyos: {node: vy1, cmd: "show interfaces", expect: 're:eth2\s+192\.168\.2\.1/24', desc: "vy1 es la puerta de enlace de su LAN"}
- vyos: {node: vy1, cmd: "show ip route", expect: 're:S>\*\s+192\.168\.1\.0/24', desc: "vy1 conoce la LAN de la central con una ruta estática"}
- routeros: {node: r1, cmd: "/ip firewall nat print count-only", expect: "0", desc: "Sin NAT en la central"}
