name: netlabs
topology:
  nodes:
    pc1:
      kind: linux
      image: netlabs/client:0.2
      exec: ["ip addr add 192.168.10.20/24 dev eth1", "ip route replace default via 192.168.10.1 dev eth1"]
    gw:
      kind: linux
      image: netlabs/debian:0.1
      exec: ["ip addr add 192.168.10.1/24 dev eth1", "ip addr add 10.20.0.1/24 dev eth2", "sysctl -qw net.ipv4.ip_forward=1"]
    srv:
      kind: linux
      image: netlabs/debian:0.1
      exec: ["ip addr add 10.20.0.10/32 dev eth1", "ip route del default"]
  links:
    - endpoints: ["pc1:eth1", "gw:eth1"]
    - endpoints: ["gw:eth2", "srv:eth1"]
