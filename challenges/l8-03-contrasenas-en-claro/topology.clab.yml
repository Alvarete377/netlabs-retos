name: netlabs
topology:
  kinds:
    mikrotik_ros:
      image: netlabs/chr:7.16.2
    linux:
      image: netlabs/client:0.1
  nodes:
    sw: {kind: mikrotik_ros}
    r1: {kind: mikrotik_ros}
    pc1:
      kind: linux
      exec: ["ip addr add 192.168.1.10/24 dev eth1", "ip route replace default via 192.168.1.1 dev eth1"]
    analista:
      kind: linux
      exec: ["ip addr add 192.168.1.50/24 dev eth1", "ip route replace default via 192.168.1.1 dev eth1"]
    srv:
      kind: linux
      exec: ["ip addr add 192.168.20.10/24 dev eth1", "ip route replace default via 192.168.20.1 dev eth1"]
  links:
    - endpoints: ["sw:eth1", "pc1:eth1"]
    - endpoints: ["sw:eth2", "analista:eth1"]
    - endpoints: ["sw:eth3", "r1:eth1"]
    - endpoints: ["r1:eth2", "srv:eth1"]
