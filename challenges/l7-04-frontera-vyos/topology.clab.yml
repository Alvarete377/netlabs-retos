name: netlabs
topology:
  kinds:
    mikrotik_ros:
      image: netlabs/chr:7.16.2
    vyosnetworks_vyos:
      image: netlabs/vyos:rolling
    linux:
      image: netlabs/client:0.1
  nodes:
    vy1: {kind: vyosnetworks_vyos}
    isp: {kind: mikrotik_ros}
    pc1:
      kind: linux
      exec: ["ip addr add 192.168.1.10/24 dev eth1", "ip route replace default via 192.168.1.1 dev eth1"]
    web:
      kind: linux
      exec: ["ip addr add 192.168.50.10/24 dev eth1", "ip route replace default via 192.168.50.1 dev eth1"]
    srv:
      kind: linux
      exec: ["ip addr add 198.51.100.10/24 dev eth1", "ip route replace default via 198.51.100.1 dev eth1"]
  links:
    - endpoints: ["vy1:eth1", "isp:eth1"]
    - endpoints: ["vy1:eth2", "pc1:eth1"]
    - endpoints: ["vy1:eth3", "web:eth1"]
    - endpoints: ["isp:eth2", "srv:eth1"]
