- routeros: {node: r1, cmd: ':put [/system ntp client get status]', expect: "synchronized", desc: "r1 tiene el reloj sincronizado"}
- routeros: {node: r1, cmd: ':put [/system ntp client get synced-server]', expect: "172.16.12.2", desc: "r1 toma la hora del centro de datos"}
- shell: {node: pc1, cmd: 'timeout 6 ntpd -n -w -p 192.168.1.1 2>&1 | grep -c "reply from 192.168.1.1"', expect: 're:^[1-9]', desc: "r1 da la hora a la sede"}
