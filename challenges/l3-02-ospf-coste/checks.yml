- ping: {from: pc1, to: 192.168.4.10, expect: ok}
- ping: {from: pc2, to: 192.168.1.10, expect: ok}
- routeros: {node: r1, cmd: '/ip route print count-only where dst-address=192.168.4.0/24 and ospf and active and gateway~"^172\\.16\\.13\\.2"', expect: "1", desc: "r1 llega a 192.168.4.0/24 por OSPF a través de r3 (172.16.13.2)"}
- routeros: {node: r1, cmd: '/ip route print count-only where dst-address=192.168.4.0/24 and active and gateway~"^172\\.16\\.12\\.2"', expect: "0", desc: "r1 no usa el camino de backup por r2 (172.16.12.2) hacia 192.168.4.0/24"}
- routeros: {node: r4, cmd: '/ip route print count-only where dst-address=192.168.1.0/24 and ospf and active and gateway~"^172\\.16\\.34\\.1"', expect: "1", desc: "r4 llega a 192.168.1.0/24 por OSPF a través de r3 (172.16.34.1)"}
- routeros: {node: r4, cmd: '/ip route print count-only where dst-address=192.168.1.0/24 and active and gateway~"^172\\.16\\.24\\.1"', expect: "0", desc: "r4 no usa el camino de backup por r2 (172.16.24.1) hacia 192.168.1.0/24"}
- routeros: {node: r1, cmd: "/routing ospf neighbor print count-only where state=Full and dr!=0.0.0.0", expect: "2", desc: "r1 mantiene sus dos vecinos OSPF en estado Full (r2 y r3)"}
- routeros: {node: r2, cmd: "/routing ospf neighbor print count-only where state=Full and dr!=0.0.0.0", expect: "2", desc: "r2 mantiene sus dos vecinos OSPF en estado Full (r1 y r4)"}
- routeros: {node: r3, cmd: "/routing ospf neighbor print count-only where state=Full and dr!=0.0.0.0", expect: "2", desc: "r3 mantiene sus dos vecinos OSPF en estado Full (r1 y r4)"}
- routeros: {node: r4, cmd: "/routing ospf neighbor print count-only where state=Full and dr!=0.0.0.0", expect: "2", desc: "r4 mantiene sus dos vecinos OSPF en estado Full (r2 y r3)"}
- routeros: {node: r1, cmd: "/routing ospf area print count-only where area-id=0.0.0.0 and !disabled", expect: "1", desc: "r1 usa una única área backbone (0.0.0.0)"}
- routeros: {node: r2, cmd: "/routing ospf area print count-only where area-id=0.0.0.0 and !disabled", expect: "1", desc: "r2 usa una única área backbone (0.0.0.0)"}
- routeros: {node: r3, cmd: "/routing ospf area print count-only where area-id=0.0.0.0 and !disabled", expect: "1", desc: "r3 usa una única área backbone (0.0.0.0)"}
