- routeros: {node: r1, cmd: "/routing ospf area print count-only where area-id!=0.0.0.0 and !disabled", expect: "0", desc: "r1 no tiene áreas fuera del backbone (0.0.0.0)"}
- routeros: {node: r2, cmd: "/routing ospf area print count-only where area-id!=0.0.0.0 and !disabled", expect: "0", desc: "r2 no tiene áreas fuera del backbone (0.0.0.0)"}
