name: netlabs
topology:
  kinds:
    mikrotik_ros:
      image: netlabs/chr:7.16.2
    linux:
      image: netlabs/client:0.1
  nodes:
    pe1: {kind: mikrotik_ros}
    p: {kind: mikrotik_ros}
    pe2: {kind: mikrotik_ros}
    pcA1:
      kind: linux
      exec: ["ip addr add 192.168.1.10/24 dev eth1", "ip route replace default via 192.168.1.1 dev eth1"]
    pcB1:
      kind: linux
      exec: ["ip addr add 192.168.1.20/24 dev eth1", "ip route replace default via 192.168.1.1 dev eth1"]
    pcA2:
      kind: linux
      exec: ["ip addr add 192.168.2.10/24 dev eth1", "ip route replace default via 192.168.2.1 dev eth1"]
    pcB2:
      kind: linux
      exec: ["ip addr add 192.168.2.20/24 dev eth1", "ip route replace default via 192.168.2.1 dev eth1"]
  links:
    - endpoints: ["pe1:eth1", "p:eth1"]
    - endpoints: ["p:eth2", "pe2:eth1"]
    - endpoints: ["pe1:eth2", "pcA1:eth1"]
    - endpoints: ["pe1:eth3", "pcB1:eth1"]
    - endpoints: ["pe2:eth2", "pcA2:eth1"]
    - endpoints: ["pe2:eth3", "pcB2:eth1"]
