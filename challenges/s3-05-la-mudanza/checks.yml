- shell: {node: pc1, cmd: "for i in 1 2 3 4 5 6; do r=$(curl -s -m2 http://10.0.0.10:8080/); [ -n \"$r\" ] && break; sleep 1; done; echo \"$r\"", expect: "<h1>Tienda online</h1>", desc: "pc1 carga la tienda nueva en 10.0.0.10:8080"}
- shell: {node: srv, cmd: "systemctl is-enabled container-tienda 2>&1; systemctl is-active container-tienda 2>&1", expect: "enabled\nactive", desc: "container-tienda está habilitada y activa"}
- shell: {node: srv, cmd: "systemctl is-active antigua-tienda 2>&1; systemctl is-enabled antigua-tienda 2>&1", expect: "re:^(inactive|failed)\\n(disabled|masked)$", desc: "La tienda antigua está parada y no arranca con el sistema"}
- shell: {node: srv, cmd: "podman inspect -f '{{.HostConfig.ReadonlyRootfs}}' tienda 2>&1", expect: "true", desc: "tienda sigue con la raíz de sólo lectura"}
- shell: {node: srv, cmd: "podman inspect -f '{{range .Mounts}}{{.Source}}->{{.Destination}}:{{.RW}} {{end}}' tienda 2>&1", expect: "re:/srv/tienda/html->/usr/share/nginx/html:false", desc: "La web se monta de /srv/tienda/html en sólo lectura"}
- shell: {node: srv, cmd: "podman inspect tienda >/dev/null 2>&1 || { echo sin-contenedor; exit; }; podman kill tienda >/dev/null 2>&1; sleep 2; for i in $(seq 20); do [ \"$(podman inspect -f '{{.State.Status}}' tienda 2>/dev/null)\" = running ] && curl -s -m2 http://127.0.0.1:8080/ | grep -qF '<h1>Tienda online</h1>' && { echo vuelve; exit; }; sleep 1; done; echo no-vuelve", expect: "vuelve", desc: "Si el contenedor muere, systemd lo levanta"}
