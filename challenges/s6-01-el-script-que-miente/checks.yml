- shell: {node: srv, cmd: "rm -rf /srv/app/logs; mkdir -p /srv/app/logs/antiguos; cd /srv/app/logs; touch -d '10 days ago' 'error del lunes.log' viejo.log antiguos/abril.log 'copia vieja.log.gz'; touch reciente.log 'hoy tambien.log'; touch -d '10 days ago' /srv/app/fuera.log; /usr/local/bin/limpiar-logs >/dev/null 2>&1; ls /srv/app/logs | grep -c 'error del lunes.log'", expect: "0", desc: "Borra los viejos con espacios en el nombre"}
- shell: {node: srv, cmd: "rm -rf /srv/app/logs; mkdir -p /srv/app/logs/antiguos; cd /srv/app/logs; touch -d '10 days ago' 'error del lunes.log' viejo.log antiguos/abril.log 'copia vieja.log.gz'; touch reciente.log 'hoy tambien.log'; touch -d '10 days ago' /srv/app/fuera.log; /usr/local/bin/limpiar-logs >/dev/null 2>&1; ls /srv/app/logs/viejo.log /srv/app/logs/antiguos/abril.log 2>/dev/null | wc -l", expect: "0", desc: "Borra los viejos, también en subcarpetas"}
- shell: {node: srv, cmd: "rm -rf /srv/app/logs; mkdir -p /srv/app/logs/antiguos; cd /srv/app/logs; touch -d '10 days ago' 'error del lunes.log' viejo.log antiguos/abril.log 'copia vieja.log.gz'; touch reciente.log 'hoy tambien.log'; touch -d '10 days ago' /srv/app/fuera.log; /usr/local/bin/limpiar-logs >/dev/null 2>&1; ls /srv/app/logs/reciente.log '/srv/app/logs/hoy tambien.log' '/srv/app/logs/copia vieja.log.gz' /srv/app/fuera.log 2>/dev/null | wc -l", expect: "4", desc: "Respeta los recientes, los .log.gz y lo de fuera"}
- shell: {node: srv, cmd: "rm -rf /srv/app/logs; out=$(/usr/local/bin/limpiar-logs 2>/dev/null); rc=$?; mkdir -p /srv/app/logs; [ $rc -ne 0 ] && ! echo \"$out\" | grep -q 'limpieza hecha' && echo error-bien || echo miente", expect: "error-bien", desc: "Sin la carpeta, termina con error"}
