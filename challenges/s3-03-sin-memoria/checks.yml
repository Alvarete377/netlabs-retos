- shell: {node: srv, cmd: "podman inspect -f '{{.State.Status}}' informes 2>&1", expect: "running", desc: "El contenedor informes está en marcha"}
- shell: {node: pc1, cmd: "for i in 1 2 3 4 5 6; do r=$(curl -s -m2 http://10.0.0.10:8081/); [ -n \"$r\" ] && break; sleep 1; done; echo \"$r\"", expect: "Informe diario: OK", desc: "pc1 ve el informe en 10.0.0.10:8081"}
- shell: {node: srv, cmd: "m=$(podman inspect -f '{{.HostConfig.Memory}}' informes 2>/dev/null); [ -n \"$m\" ] && [ \"$m\" -ge 134217728 ] && [ \"$m\" -le 536870912 ] && echo ok || echo \"limite=$m\"", expect: "ok", desc: "Tiene un límite de memoria razonable (128-512 MB)"}
- shell: {node: srv, cmd: "systemctl is-enabled container-informes 2>&1; systemctl is-active container-informes 2>&1", expect: "enabled\nactive", desc: "La unidad container-informes está habilitada y activa"}
- shell: {node: srv, cmd: "podman inspect informes >/dev/null 2>&1 || { echo sin-contenedor; exit; }; podman kill informes >/dev/null 2>&1; sleep 2; for i in $(seq 20); do [ \"$(podman inspect -f '{{.State.Status}}' informes 2>/dev/null)\" = running ] && curl -s -m2 http://127.0.0.1:8081/ | grep -qF 'Informe diario: OK' && { echo vuelve; exit; }; sleep 1; done; echo no-vuelve", expect: "vuelve", desc: "Si el contenedor muere, systemd lo levanta"}
