name: netlabs
topology:
  kinds:
    mikrotik_ros:
      image: netlabs/chr:7.16.2
    linux:
      image: netlabs/client:0.1
  nodes:
    sw1: {kind: mikrotik_ros}
    sw2: {kind: mikrotik_ros}
    sw3: {kind: mikrotik_ros}
    sw4: {kind: mikrotik_ros}
    pc1:
      kind: linux
      exec: ["ip addr add 192.168.10.11/24 dev eth1"]
    pc2:
      kind: linux
      exec: ["ip addr add 192.168.10.12/24 dev eth1"]
    pc3:
      kind: linux
      exec: ["ip addr add 192.168.10.21/24 dev eth1"]
    pc4:
      kind: linux
      exec: ["ip addr add 192.168.10.22/24 dev eth1"]
    pc5:
      kind: linux
      exec: ["ip addr add 192.168.10.31/24 dev eth1"]
    pc6:
      kind: linux
      exec: ["ip addr add 192.168.10.32/24 dev eth1"]
  links:
    # Anillo entre switches (eth1=ether2, eth2=ether3 en RouterOS)
    - endpoints: ["sw1:eth1", "sw2:eth1"]
    - endpoints: ["sw2:eth2", "sw3:eth1"]
    - endpoints: ["sw3:eth2", "sw4:eth1"]
    - endpoints: ["sw4:eth2", "sw1:eth2"]
    # Puertos de acceso a PCs (eth3=ether4, eth4=ether5 en RouterOS)
    - endpoints: ["sw1:eth3", "pc1:eth1"]
    - endpoints: ["sw2:eth3", "pc2:eth1"]
    - endpoints: ["sw2:eth4", "pc5:eth1"]
    - endpoints: ["sw3:eth3", "pc3:eth1"]
    - endpoints: ["sw4:eth3", "pc4:eth1"]
    - endpoints: ["sw4:eth4", "pc6:eth1"]
