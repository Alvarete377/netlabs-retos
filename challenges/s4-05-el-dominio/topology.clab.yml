name: netlabs
topology:
  nodes:
    dc1:
      kind: linux
      image: netlabs/samba:0.1
      exec: ["ip addr add 10.0.0.10/24 dev eth1"]
    pc1:
      kind: linux
      image: netlabs/samba:0.1
      exec: ["ip addr add 10.0.0.20/24 dev eth1"]
  links:
    - endpoints: ["dc1:eth1", "pc1:eth1"]
