- shell: {node: srv, cmd: "rm -f /var/backups/datos/copia-*; systemctl start copia.service 2>/dev/null; sleep 1; f=$(ls -t /var/backups/datos/copia-*.tar.gz 2>/dev/null | head -1); [ -n \"$f\" ] && tar -tzf \"$f\" | grep -c 'srv/datos/clientes.csv'", expect: "1", desc: "copia.service hace una copia válida con los datos"}
- shell: {node: srv, cmd: "touch /tmp/copia.lock; rm -f /var/backups/datos/copia-*; systemctl start copia.service 2>/dev/null; sleep 1; ls /var/backups/datos/copia-*.tar.gz 2>/dev/null | wc -l", expect: "1", desc: "Un cerrojo viejo de una copia muerta no la bloquea"}
- shell: {node: srv, cmd: "rm -f /var/backups/datos/copia-*; for i in $(seq 10); do touch -d \"$i days ago\" /var/backups/datos/copia-2020-01-$(printf %02d $i)-000000.tar.gz; done; systemctl start copia.service 2>/dev/null; sleep 1; echo $(ls /var/backups/datos/copia-*.tar.gz | wc -l) $(ls /var/backups/datos/copia-2020-01-0[1-6]* 2>/dev/null | wc -l) $(ls /var/backups/datos/copia-2020-01-0[7-9]* /var/backups/datos/copia-2020-01-10* 2>/dev/null | wc -l)", expect: "7 6 0", desc: "Rotación: quedan las 7 más recientes (la nueva y 6 viejas)"}
- shell: {node: srv, cmd: "cat /var/backups/datos/LEEME.txt 2>/dev/null | head -c 6", expect: "Copias", desc: "La rotación no borra LEEME.txt"}
- shell: {node: srv, cmd: "mv /srv/datos /srv/datos.x; DESTINO_COPIAS=/tmp/prueba-copia /usr/local/bin/copia >/dev/null 2>&1; rc=$?; mv /srv/datos.x /srv/datos; rm -rf /tmp/prueba-copia; [ $rc -ne 0 ] && echo error || echo calla", expect: "error", desc: "Sin /srv/datos, el script termina con error"}
- shell: {node: srv, cmd: "ls / | grep -c '^copia-'", expect: "0", desc: "No hay copias tiradas en /"}
