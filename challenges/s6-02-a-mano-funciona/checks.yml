- shell: {node: srv, cmd: "rm -f /var/informes/salida/*; cd / && env -i PATH=/usr/bin:/bin HOME=/root LOGNAME=root SHELL=/bin/sh /usr/local/bin/informe-diario >/dev/null 2>&1; cat /var/informes/salida/informe-$(date +%F).txt 2>/dev/null", expect: "re:^Ventas del ", desc: "Con el entorno de cron, deja el informe en /var/informes/salida/"}
- shell: {node: srv, cmd: "cd / && env -i PATH=/usr/bin:/bin HOME=/root LOGNAME=root SHELL=/bin/sh /usr/local/bin/informe-diario >/dev/null 2>&1 && echo bien || echo falla", expect: "bien", desc: "Con el entorno de cron, termina bien"}
- shell: {node: srv, cmd: "mv /opt/ventas/bin/informe-ventas /tmp/iv; /usr/local/bin/informe-diario >/dev/null 2>&1; rc=$?; mv /tmp/iv /opt/ventas/bin/informe-ventas; [ $rc -ne 0 ] && echo error || echo calla", expect: "error", desc: "Si falla, termina con error"}
- shell: {node: srv, cmd: "grep -v '^#' /etc/cron.d/informe | grep -c '^0 7 \\* \\* \\* root /usr/local/bin/informe-diario'", expect: "1", desc: "La tarea de cron sigue a las 07:00"}
- shell: {node: srv, cmd: "grep -v '^#' /etc/cron.d/informe | grep -c 'logger -t informe-diario'", expect: "1", desc: "La salida de cron va al journal (logger -t informe-diario)"}
