id: s6-03-las-ips-mas-pesadas
title: Las IPs más pesadas
level: 106
type: build
difficulty: medium
objectives:
  - "Escribe `/usr/local/bin/top-ips FICHERO`: lee un log de acceso de nginx y saca las 3 IPs con más peticiones, de más a menos, una por línea con el formato `veces ip` (p. ej. `27 10.1.2.3`)"
  - "Con `-n N` saca las N primeras (`top-ips -n 5 fichero`)"
  - "Si el fichero no existe o no se puede leer, avisa por la salida de error y termina con código 2"
  - "Tiene que funcionar con cualquier log, no sólo con el de ejemplo: el check lo prueba con uno nuevo cada vez"
hints:
  - "Hay un ejemplo en `/var/log/nginx/acceso-ejemplo.log`. La IP es el primer campo: `awk '{print $1}'` o `cut -d' ' -f1`."
  - "La receta clásica para contar: `sort | uniq -c | sort -rn | head`. `uniq -c` rellena con espacios por la izquierda: otro `awk '{print $1\" \"$2}'` deja el formato limpio."
  - "Opciones en bash: `getopts \"n:\" opt` dentro de un `while`, y luego `shift $((OPTIND - 1))` para que `$1` sea el fichero."
  - "El código de salida se pone con `exit 2`, y los avisos a la salida de error con `echo ... >&2`. No olvides `chmod +x`."
